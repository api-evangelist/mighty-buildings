aid: mighty-buildings
name: Mighty Buildings
description: Mighty Buildings is a construction-technology and advanced-manufacturing company that
  industrializes homebuilding using large-format 3D printing, proprietary polymer-composite materials
  and robotic automation. Founded in 2019 and originally based in Oakland, California, it raised more
  than $150 million from investors including Khosla Ventures, Bold Capital and Aramco's Wa'ed Ventures,
  and was the first company certified under the UL 3401 standard for evaluating building structures and
  assemblies, as well as being certified under California's Factory Built Housing program. Its current
  product is the Mighty Kit System / Mighty Wall System - factory-made complete wall panels that arrive
  on site with integrated structure, insulation, waterproofing and exterior finish, so builders assemble
  a building envelope with conventional methods and fewer on-site steps. After a January 2025 restructuring
  and sale process, the full suite of Mighty Buildings technologies was acquired by LUMUS Inc., and Mighty
  Buildings now operates as a LUMUS brand headquartered in Beaverton, Oregon. The company sells physical
  building systems to developers and builders; it operates no public API, developer portal, SDK, or
  machine-readable specification of any kind.
